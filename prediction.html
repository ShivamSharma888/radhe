<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR | Smart Scrub Typhus Monitoring</title>


  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>


  </style>
</head>

<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="assets/images/logo.png" alt="Star-logo">
        <span>STAR</span>
      </div>
      <div class="menu-icon" onclick="toggleMenu()">☰</div>
      <ul class="nav-links" id="navLinks">
        <li> <a href="index.html">Home</a></li>
        <li><a href="about-us.html">About Us</a></li>
        <li><a href="hotspots.html">Hotspots</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="assessment.html">Assessment</a></li>
        <li><a href="prediction.html">Prediction</a></li>
        <li><a href="hospitals.html">Hospitals</a></li>
        <li><a href="contact-us.html">Contact Us</a></li>

      </ul>
    </nav>
  </header>



  <section class="prediction">
    <div class="container-box">

      <h2 class="section-title">Climate-Based Risk Prediction</h2>
      <p class="text-muted">Get risk prediction using **GPS**, **place name search**, or **manual latitude/longitude**.
      </p>

      <hr>

      <!-- GPS BUTTON -->
      <button id="autoGPS" class="btn btn-success w-100 mb-3">
        📍 Use My Current Location (GPS)
      </button>

      <!-- Search Box -->
      <div class="input-group mb-3">
        <input id="searchPlace" class="form-control" placeholder="Search a place (e.g., Shimla, Delhi, Mumbai)">
        <button class="btn btn-info" id="searchBtn">Search</button>
      </div>

      <!-- Manual Inputs -->
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Latitude</label>
          <input id="lat" class="form-control" placeholder="e.g. 31.0">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Longitude</label>
          <input id="lon" class="form-control" placeholder="e.g. 77.1">
        </div>
      </div>

      <button id="getClimate" class="btn btn-custom w-100 my-3">Get Prediction</button>

      <div id="predictionBox"></div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-content">
      <span>© 2025 STAR • Smart Scrub Typhus Monitoring Platform</span>

      <div class="footer-socials">
        <a href="#" aria-label="Website"><i class="fas fa-globe"></i></a>
        <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </footer>

  
  <script src="assets/js/script.js"></script>
  <script>
    /* -----------------------------
       SEARCH LOCATION (NO API KEY)
    ----------------------------- */
    document.getElementById("searchBtn").addEventListener("click", () => {
      let place = document.getElementById("searchPlace").value.trim();
      if (!place) return alert("Please enter a place name");

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`)
        .then(r => r.json())
        .then(data => {
          if (data.length === 0) return alert("Place not found!");

          let loc = data[0];
          document.getElementById("lat").value = loc.lat;
          document.getElementById("lon").value = loc.lon;

          alert("Location found! Coordinates filled automatically.");
        });
    });


    /* -----------------------------
       GPS AUTO LOCATION
    ----------------------------- */
    document.getElementById("autoGPS").addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("GPS not supported on this device");
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById("lat").value = pos.coords.latitude.toFixed(4);
        document.getElementById("lon").value = pos.coords.longitude.toFixed(4);
        alert("GPS location detected!");
      });
    });


    /* -----------------------------
       MAIN CLIMATE PREDICTION
    ----------------------------- */
    document.getElementById("getClimate").addEventListener("click", () => {
      let lat = document.getElementById("lat").value;
      let lon = document.getElementById("lon").value;

      if (!lat || !lon) return alert("Enter coordinates first!");

      let url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,rain`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          let t = data.hourly.temperature_2m[0];
          let h = data.hourly.relative_humidity_2m[0];
          let r = data.hourly.rain[0];

          let result = `
              <h4 class="fw-bold text-primary">Prediction Result</h4>
              <p><b>Temperature:</b> ${t}°C</p>
              <p><b>Humidity:</b> ${h}%</p>
              <p><b>Rainfall:</b> ${r} mm</p>
            `;

          let risk = "Low Risk 😌";
          if (t >= 20 && t <= 30 && h > 60) risk = "Moderate Risk ⚠️";
          if (t >= 23 && t <= 28 && h > 70 && r > 0) risk = "High Risk 🔥";

          result += `<h4 class="mt-3">Scrub Typhus Risk: <span class="text-danger">${risk}</span></h4>`;

          let box = document.getElementById("predictionBox");
          box.innerHTML = result;
          box.style.display = "block";
        });
    });
  </script>

</body>

</html>
