<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR | Smart Scrub Typhus Monitoring</title>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="assets/css/main.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
    <style>


    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="assets/images/logo.png" alt="Star-logo">
                <span>STAR</span>
            </div>
            <div class="menu-icon" onclick="toggleMenu()">☰</div>
            <ul class="nav-links" id="navLinks">
                <li> <a href="index.html">Home</a></li>
                <li><a href="about-us.html">About Us</a></li>
                <li><a href="hotspots.html">Hotspots</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="assessment.html">Assessment</a></li>
                <li><a href="prediction.html">Prediction</a></li>
                <li><a href="hospitals.html">Hospitals</a></li>
                <li><a href="contact-us.html">Contact Us</a></li>

            </ul>
        </nav>
    </header>





    <section class="hospitals">

        <h2>Nearby Hospitals</h2>

        <div id="inputDiv">
            <input id="placeName" placeholder="Enter place (e.g. Delhi)">
            <button onclick="searchPlace()">Search</button>
        </div>

        <div id="map"></div>

        <div id="weatherPopup">
            <h3>🌤 Weather</h3>
            <div id="weatherContent"></div>
            <button onclick="closeWeather()">Close</button>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-content">
            <span>© 2025 STAR • Smart Scrub Typhus Monitoring Platform</span>

            <div class="footer-socials">
                <a href="#" aria-label="Website"><i class="fas fa-globe"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>

    <!-- JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        function toggleMenu() {
            document.getElementById("navLinks").classList.toggle("show");
        }

        /* ===== MAP INITIALIZATION (FIXED) ===== */
        let map = L.map('map').setView([20.5937, 78.9629], 5); // India default

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userLat, userLon;
        let currentRoute;

        /* DEMO HOSPITALS */
        const customHotspots = [
            { name: "City Hospital", lat: 31.705, lon: 76.985 },
            { name: "Health Care Center", lat: 31.710, lon: 76.990 }
        ];

        /* LOCATION */
        function locateUser() {
            if (!navigator.geolocation) {
                alert("Geolocation not supported");
                return;
            }

            navigator.geolocation.getCurrentPosition(pos => {
                userLat = pos.coords.latitude;
                userLon = pos.coords.longitude;
                showUser();
                getWeather(userLat, userLon);
            }, () => {
                alert("Location permission denied");
            });
        }

        function showUser() {
            map.setView([userLat, userLon], 13);

            L.circleMarker([userLat, userLon], {
                radius: 8, color: "green", fillColor: "#0f0", fillOpacity: 0.8
            }).addTo(map).bindPopup("You are here");

            plotHospitals();
        }

        /* SEARCH */
        function searchPlace() {
            const place = document.getElementById("placeName").value;
            if (!place) return;

            axios.get(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`)
                .then(res => {
                    if (!res.data.length) return alert("Place not found");
                    userLat = parseFloat(res.data[0].lat);
                    userLon = parseFloat(res.data[0].lon);
                    showUser();
                    getWeather(userLat, userLon);
                });
        }

        /* WEATHER */
        function getWeather(lat, lon) {
            axios.get(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                .then(res => {
                    const w = res.data.current_weather;
                    document.getElementById("weatherContent").innerHTML =
                        `🌡 ${w.temperature}°C<br>💨 ${w.windspeed} km/h`;
                    document.getElementById("weatherPopup").style.display = "block";
                });
        }
        function closeWeather() {
            document.getElementById("weatherPopup").style.display = "none";
        }

        /* HOSPITAL MARKERS */
        function plotHospitals() {
            customHotspots.forEach(h => {
                L.marker([h.lat, h.lon]).addTo(map)
                    .bindPopup(`<b>${h.name}</b><br><button onclick="drawRoute(${h.lat},${h.lon})">Route</button>`);
            });
        }

        /* ROUTE */
        function drawRoute(lat, lon) {
            if (currentRoute) map.removeControl(currentRoute);

            currentRoute = L.Routing.control({
                waypoints: [
                    L.latLng(userLat, userLon),
                    L.latLng(lat, lon)
                ],
                draggableWaypoints: false
            }).addTo(map);
        }

        /* INIT */
        locateUser();
    </script>

</body>

</html>
